name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
          POSTGRES_DB: axiom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom -d axiom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://axiom:axiom@127.0.0.1:5432/axiom
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r backend/requirements-dev.txt

      - name: Apply Alembic migration to real PostgreSQL
        run: cd backend && alembic upgrade head

      - name: Run pytest
        run: cd backend && python -m pytest -q

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker compose build

      - name: Smoke-test the API and the worker containers
        # The worker used to exit with code 1 (a missing task module) and
        # nothing reported it: the API does not depend on the worker, and
        # no test imported the module either. `compose up --wait` fails as
        # soon as a container exits, which is the check that was missing.
        #
        # Starting the API too proves that the image boots with the
        # configuration the Compose file gives it, and that it reaches
        # PostgreSQL and Redis over the Compose network.
        run: |
          # Create the bind-mount source as the runner user. If Compose
          # creates it instead, Docker owns the host directory as root.
          mkdir -p backend/storage
          docker compose up -d --wait --wait-timeout 180 api worker
          docker compose logs worker 2>&1 | grep -E "ready\."
          curl -fsS http://127.0.0.1:8000/ready

      - name: Verify the API and worker share storage
        # A file written by the API must be readable by the worker, which
        # runs as a different uid. This catches a missing or divergent bind
        # mount before the worker is asked to process an upload.
        run: |
          cleanup() {
            docker compose exec -T api rm -f /srv/backend/storage/.compose-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose exec -T api sh -c 'test "$STORAGE_ROOT" = /srv/backend/storage'
          docker compose exec -T worker sh -c 'test "$STORAGE_ROOT" = /srv/backend/storage'

          docker compose exec -T api sh -c 'printf "shared-storage" > /srv/backend/storage/.compose-smoke'
          test "$(docker compose exec -T worker cat /srv/backend/storage/.compose-smoke)" = "shared-storage"

      - name: Stop the containers
        run: docker compose down
