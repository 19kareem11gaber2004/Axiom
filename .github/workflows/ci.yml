name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
          POSTGRES_DB: axiom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom -d axiom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://axiom:axiom@127.0.0.1:5432/axiom
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the frozen evaluation corpus
        run: python eval/v0.1/verify.py

      - run: pip install -r backend/requirements-dev.txt

      - name: Apply Alembic migration and verify reversibility
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run pytest
        run: cd backend && python -m pytest -q

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker compose build

      - name: Prepare the Compose database
        # The Compose stack owns a PostgreSQL volume separate from the
        # job service above. Migrate that database too; otherwise the API
        # is "ready" (SELECT 1 succeeds) but has no application tables.
        run: |
          mkdir -p backend/storage
          docker compose up -d --wait --wait-timeout 180 postgres redis
          docker compose run --rm --no-deps api alembic upgrade head

      - name: Smoke-test the API, worker, and Beat containers
        # The worker used to exit with code 1 (a missing task module) and
        # nothing reported it: the API does not depend on the worker, and
        # no test imported the module either. `compose up --wait` fails as
        # soon as a container exits, which is the check that was missing.
        #
        # Starting the API too proves that the image boots with the
        # configuration the Compose file gives it, and that it reaches
        # PostgreSQL and Redis over the Compose network.
        run: |
          docker compose up -d --wait --wait-timeout 180 api worker beat

          # --wait only proves the containers are running. Celery and Beat
          # print their readiness lines after that, so wait for the text
          # the smoke check actually asserts.
          wait_for_log() {
            service="$1"
            pattern="$2"
            for _ in $(seq 1 30); do
              if docker compose logs "$service" 2>&1 | grep -q "$pattern"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for_log worker "ready\."
          wait_for_log beat "beat: Starting"
          docker compose logs worker 2>&1 | grep -E "ready\."
          docker compose logs beat 2>&1 | grep -E "beat: Starting"
          curl -fsS http://127.0.0.1:8000/ready

      - name: Verify worker task registration
        run: |
          docker compose exec -T worker celery \
            -A app.worker.celery_app inspect registered \
            > /tmp/axiom-registered.txt
          cat /tmp/axiom-registered.txt
          grep -q "documents.process" /tmp/axiom-registered.txt
          grep -q "documents.sweep" /tmp/axiom-registered.txt

      - name: Verify upload to indexed flow end to end
        run: docker compose exec -T api python scripts/worker_smoke.py

      - name: Verify the API and worker share storage
        # A file written by the API must be readable by the worker, which
        # runs as a different uid. This catches a missing or divergent bind
        # mount before the worker is asked to process an upload.
        run: |
          cleanup() {
            docker compose exec -T api rm -f /srv/backend/storage/.compose-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose exec -T api sh -c 'test "$STORAGE_ROOT" = /srv/backend/storage'
          docker compose exec -T worker sh -c 'test "$STORAGE_ROOT" = /srv/backend/storage'

          docker compose exec -T api sh -c 'printf "shared-storage" > /srv/backend/storage/.compose-smoke'
          test "$(docker compose exec -T worker cat /srv/backend/storage/.compose-smoke)" = "shared-storage"

      - name: Collect container diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300

      - name: Stop the containers
        if: always()
        run: docker compose down -v
